name: CI

on:
  push:
    branches: [main, "replan/**"]
  pull_request:
    branches: [main]

jobs:
  garim:
    name: garim core (unit, lint, privacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit and golden tests
        run: python -m pytest
      - name: Lint and import check
        run: |
          ruff check garim tests tools
          python -m compileall -q garim tools
      - name: No committed checksum-valid resident number
        run: python tools/no_committed_pii.py

  probes:
    name: design probes (appendix A)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run dependency-free design probes
        run: |
          set -e
          for probe in checksum_probe fpr_probe josa_probe vault_probe \
                       normalize_probe offset_probe marker_probe roundtrip_probe \
                       token_efficiency_probe token_efficiency_fix; do
            python "docs/${probe}.py"
          done
      - name: Assert interval-map baseline
        run: python docs/offset_probe.py | grep -qE '^9/9 '
      - name: Assert generator-to-rule round trip
        run: python docs/roundtrip_probe.py | grep -q '전건 통과'
