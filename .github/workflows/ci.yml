name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: core tests (no presidio/torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.core.txt
      - name: Lint (syntax)
        run: python -m compileall -q src eval scripts
      - name: Policy schema sanity (log-only 봉인 + AFC=False 불변식)
        run: |
          python -c "from src.config import load_policy, gen_config; p=load_policy(); assert gen_config(p).automatic_function_calling is False"
      - name: Tests (presidio 의존 test_dlp_defenses 는 full 잡에서)
        run: pytest -q --ignore=tests/test_dlp_defenses.py

  # full 잡(presidio/spacy 설치 + 전체 테스트)은 무겁고 선택적이라 로컬/수동으로 실행:
  #   pip install -r requirements.txt && pytest -q
