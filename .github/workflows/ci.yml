name: CI

on:
  push:
    branches: [main, "replan/**"]
  pull_request:
    branches: [main]

jobs:
  # ── 설계 프로브 회귀 ────────────────────────────────────────
  # 부록 A의 실측 주장이 계속 성립하는지 검사한다. 구현 착수 전에도 돈다.
  # ⚠️ 깨진 프로브를 기준선으로 동결하지 않는다 — 고칠 때 회귀로 보이기 때문이다.
  #    현재 xfail 없음: offset_probe는 구간 맵으로 재작성돼 9/9 통과한다.
  probes:
    name: design probes (부록 A 회귀)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 유니코드 DB 버전이 마이너마다 다르다 — 골든 결과가 환경마다 깨진다 (DESIGN §8.6.2)
          python-version: "3.11"
      - name: 프로브 실행 (외부 의존 없는 것만)
        run: |
          set -e
          for f in checksum_probe fpr_probe josa_probe vault_probe \
                   normalize_probe offset_probe marker_probe roundtrip_probe \
                   token_efficiency_probe token_efficiency_fix; do
            echo "── docs/$f.py ──"
            python "docs/$f.py"
          done
      - name: 역매핑 왕복 검증이 전건 통과하는가
        run: |
          python docs/offset_probe.py | grep -qE "^9/9 " \
            || { echo "offset_probe 회귀 — 구간 맵 왕복이 깨졌다"; exit 1; }

      - name: 생성기 → L0 왕복이 전건 통과하는가
        run: |
          python docs/roundtrip_probe.py | grep -q "전건 통과" \
            || { echo "roundtrip_probe 회귀 — 생성기와 L0 규칙이 어긋났다"; exit 1; }

      # ── no_committed_pii (DESIGN §5.3.5.1 · §8.6.3) ──────────
      # '실존 가능한' 2세대 주민등록번호가 추적 파일에 들어가면 실패시킨다.
      # 판정은 체크섬만이 아니라 3중 검증(체크섬 + 생년월일 + 성별코드)이다 —
      # 991332(13월 32일)처럼 날짜가 불가능하면 실존할 수 없으므로 대상이 아니다.
      # 합성 값이라도 실존 번호와 우연히 일치할 확률이 7.0e-3이라
      # (fpr_probe 충돌 산술) 저장소에 두지 않는 것이 §5.3.5.1의 결정이다.
      # 골든 파일은 3세대 형식과 성별코드 9만 쓰므로 여기 안 걸린다.
      - name: no_committed_pii — 커밋된 유효 주민번호 탐색
        run: |
          python - <<'PY'
          import re, subprocess, sys
          sys.path.insert(0, "docs")
          from fpr_probe import rrn_full   # 체크섬 + 생년월일 유효성 + 성별코드 정합

          files = subprocess.run(["git", "ls-files"], capture_output=True,
                                 text=True, check=True).stdout.split()
          pat = re.compile(r"\b(\d{6})[-\s]?([1-8]\d{6})\b")
          hits = []
          for f in files:
              try:
                  body = open(f, encoding="utf-8", errors="ignore").read()
              except (IsADirectoryError, PermissionError):
                  continue
              for m in pat.finditer(body):
                  v = m.group(1) + m.group(2)
                  if rrn_full(v):   # 3중 검증을 통과해야 '실존 가능'이다
                      line = body[:m.start()].count("\n") + 1
                      hits.append(f"{f}:{line}  {m.group(0)}")
          if hits:
              print("★ 체크섬 유효 주민등록번호가 커밋돼 있다 — DESIGN §5.3.5.1 위반")
              print("\n".join(hits[:20]))
              print("\n생성 값은 data/synth/ 아래에 두고 커밋하지 않는다.")
              print("골든 파일에는 3세대 형식이나 성별코드 9만 쓴다.")
              sys.exit(1)
          print(f"OK — 추적 파일 {len(files)}개에서 발견 0건")
          PY

  # ── 구 SafeAgent-KR (봉인) ─────────────────────────────────
  # src/·eval/·scripts/ 는 대체된 이전 프로젝트다 (docs/plan/README.md).
  # 가림 품질과 무관하며, 이 잡이 녹색인 것은 가림에 대해 아무것도 말하지 않는다.
  legacy:
    name: legacy SafeAgent-KR (봉인 — 가림 품질 신호 아님)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps (핀 고정 lock — 재현 빌드)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.core.lock
      - name: Lint (syntax)
        run: python -m compileall -q src eval scripts
      - name: Policy schema sanity (log-only 봉인 + AFC=False 불변식)
        run: |
          python -c "from src.config import load_policy, gen_config; p=load_policy(); assert gen_config(p).automatic_function_calling is False"
      - name: Tests (presidio 의존 test_dlp_defenses 는 full 잡에서)
        run: pytest -q --ignore=tests/test_dlp_defenses.py

  # ── 가림 (구현 착수 후 활성) ────────────────────────────────
  # W1에 garim/ 패키지가 생기면 아래 주석을 푼다. 지금은 잡 자체가 없다 —
  # 존재하지 않는 것을 검사하는 척하는 녹색 배지를 만들지 않는다.
  #
  # garim:
  #   name: garim (unit + golden)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: astral-sh/setup-uv@v5
  #     - run: uv sync --frozen
  #     - run: uv run pytest tests/ -q
  #     - run: uv run python -m compileall -q garim bench train
