version: 1

defaults:
  verdict: mask

rules:
  rrn_anchor: true
  # §2.5 기밀 표식 위치 가중치 임계 (첫3줄 +2 / 단독·괄호 +3 / 등급표기 +3 / 조사결합 -3).
  # 표본 10건 기준값이므로 실제 코퍼스 확보 후 재조정한다.
  marker_score_threshold: 3

codes:
  L-KR-01: block
  L-KR-02: block
  L-SEC-01: block
  L-SEC-02: block
  L-SEC-03: block
  L-SEC-04: block
  L-SEC-05: warn
  L-DOC-01: warn

content_type_policy:
  code:
    pii_threshold_delta: 0.15
    secret_threshold_delta: -0.10
    attack_threshold_delta: 0.10
    identifier_allowlist: [user_name, phone_number, ssn, email, address, birth_date, card_no, account]
  structured:
    key_exclude: true
    secret_threshold_delta: -0.10
  log:
    suppress: [L-CM-04]
    attack_threshold_delta: 0.10

thresholds:
  l1_pii: 0.5
  l1_atk: 0.5
  l0: 0.5
  l2_escalate: [0.4, 0.6]
  romanized_evasion: 0.5
  honorific_social_engineering: 0.5

limits:
  max_input_chars: 100000
  max_segments: 64
  chunk_size: 512
  chunk_overlap: 64
  max_l1_chunks: 128
  max_l2_chunks: 32
  l1_timeout_ms: 1000

custom_patterns:
  - code: L-CT-03
    name: employee_id
    regex: 'EMP-\d{6}'
    mode: mask

# 프록시 첨부(내장 기본값과 같다).
# - unmaskable: 문서(PDF · DOCX · XLSX · PPTX · HWPX · ODF)에서 꺼낸 글에 가려야 할 값이 나왔을 때 — block | warn
# - unreadable: 문서인데 읽지 못했을 때(너무 큼 · 깨짐 · 암호 · 시간 초과 · [docs] 없는 PDF) — allow | warn | block
# - uninspected: 글을 꺼낼 수 없는 첨부(이미지 · 오디오 · 글 없는 문서 · file_id) — allow | warn | block
attachments:
  unmaskable: block
  unreadable: block
  uninspected: allow
