[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garim-guard"
version = "0.1.0"
description = "Local-first Korean prompt leak and injection inspector"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
l1 = ["numpy>=1.26,<3", "onnxruntime>=1.18,<2", "transformers>=5.5,<6"]
train = [
  "accelerate>=1.10,<2",
  "datasets>=2.20,<4",
  "huggingface-hub>=0.36,<2",
  "numpy>=1.26,<3",
  "onnx>=1.16,<2",
  # torch.onnx.export defaults to the dynamo exporter, which imports onnxscript.
  # Without it every export raised ModuleNotFoundError at the end of the pipeline.
  "onnxscript>=0.7,<1",
  "onnxruntime>=1.18,<2",
  "pyarrow>=18,<24",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  # `torch.export.Dim.DYNAMIC` and the `dynamo=` switch used by garim/training/export.py
  # only exist from 2.6; the old floor advertised support this code does not have.
  "torch>=2.6,<3",
  "transformers>=5.5,<6",
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
garim = "garim.cli:main"

[tool.setuptools.packages.find]
include = ["garim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
