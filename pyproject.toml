[build-system]
requires = ["setuptools>=77"]  # PEP 639 `license` 표기
build-backend = "setuptools.build_meta"

[project]
name = "garim-guard"
version = "0.1.3"
description = "Local-first Korean prompt DLP inspector — masks PII, secrets and confidential markers and flags prompt attacks before text reaches an external LLM API"
readme = "README.md"
# 상한은 유니코드 판을 검증한 마이너까지다 — 새 판은 NFKC 를 비교한 뒤 연다(DESIGN §8.6.2).
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "seok-hee97" }]
keywords = ["korean", "dlp", "pii", "prompt-injection", "llm-security", "guardrails", "masking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Korean",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
l1 = ["numpy>=1.26,<3", "onnxruntime>=1.18,<2", "transformers>=5.5,<6"]
train = [
  "accelerate>=1.10,<2",
  # macOS 의 python.org 빌드는 시스템 루트 인증서를 안 쓴다. 라이선스 게이트 셋이
  # 전부 HTTPS 로 나가므로 없으면 CERTIFICATE_VERIFY_FAILED 로 학습 준비가 통째로
  # 막힌다 — 실제로 막혔다. `garim/tls.py` 가 있으면 쓰고 없으면 기본값으로 돈다.
  "certifi>=2026.10.18",
  "datasets>=2.20,<4",
  "huggingface-hub>=0.36,<2",
  "numpy>=1.26,<3",
  "onnx>=1.16,<2",
  # torch.onnx.export defaults to the dynamo exporter, which imports onnxscript.
  # Without it every export raised ModuleNotFoundError at the end of the pipeline.
  "onnxscript>=0.7,<1",
  "onnxruntime>=1.18,<2",
  # Gemma 4 E2B 는 멀티모달이라 `Gemma4Processor` 가 PIL 과 torchvision 을 요구한다.
  # 우리는 텍스트만 쓰지만 프로세서 임포트 단계에서 막힌다 — 교사 라벨링이 이것 없이
  # 시작조차 못 한다. 둘 다 없으면 `ModuleNotFoundError: Could not import module
  # 'Gemma4Processor'` 로만 나와서 무엇이 빠졌는지 안 보인다.
  "pillow>=11,<13",
  "torchvision>=0.21,<1",
  "pyarrow>=18,<24",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  # `torch.export.Dim.DYNAMIC` and the `dynamo=` switch used by garim/training/export.py
  # only exist from 2.6; the old floor advertised support this code does not have.
  "torch>=2.6,<3",
  "transformers>=5.5,<6",
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
bench = [
  # macOS 의 python.org 빌드는 시스템 루트 인증서를 안 쓴다. §8.1-13b 하네스가 API 키를
  # 들고 나가므로 TLS 검증을 끄는 대신 인증서 번들을 명시적으로 들고 간다.
  "certifi>=2026.10.18",
  # §7.3 베이스라인. `Kr*Recognizer` 5종이 MIT 로 들어 있고, 끄고 비교하면 H1 의 유일한
  # 외부 도구 대조가 허수아비가 된다.
  "presidio-analyzer>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/seok-hee97/garim-guard"
Documentation = "https://github.com/seok-hee97/garim-guard/blob/main/docs/README.md"
Issues = "https://github.com/seok-hee97/garim-guard/issues"
Changelog = "https://github.com/seok-hee97/garim-guard/blob/main/CHANGELOG.md"
Models = "https://huggingface.co/cycloevan/garim-guard"

[project.scripts]
garim = "garim.cli:main"

[tool.setuptools.packages.find]
include = ["garim*"]

[tool.setuptools.package-data]
"garim" = ["py.typed"]
"garim.policy" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `bench/` is an evaluation harness, not part of the shipped wheel (see packages.find),
# so it is imported from the repo root rather than from site-packages.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
